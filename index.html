<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{KylVorn}</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<meta name="description" content="KylVorn – developer portfolio: apps and open source projects.">
<meta property="og:type" content="website">
<meta property="og:title" content="KylVorn – Portfolio">
<meta property="og:description" content="Apps and open source projects by KylVorn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000; --card:#080808; --line:rgba(255,255,255,.1);
  --text:#f2f2f2; --muted:#8a8a93; --accent:#4cc2ff; --accent-2:#8b7bff;
  --sans:"Inter","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}

/* intro overlay */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);pointer-events:none;transition:opacity .45s cubic-bezier(.2,.7,.2,1)}
#intro.hide{opacity:0}

/* nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(0,0,0,.8);backdrop-filter:blur(16px);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:rgba(0,0,0,.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);opacity:0;transition:opacity .8s}
body.ready header{opacity:1}
nav{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--mono);font-weight:700;font-size:15px}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav ul a{display:block;padding:6px 12px;border-radius:8px;color:var(--muted);font-size:14px;transition:background .2s,color .2s}
nav ul a:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* hero */
.hero{min-height:calc(100svh - 57px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 0}
.type{font-family:var(--mono);font-weight:700;font-size:clamp(32px,9.5vw,112px);letter-spacing:-.04em;line-height:1.1;margin:0;min-height:1.2em;white-space:nowrap}
.type .br{color:var(--text)}
.caret{display:inline-block;width:.07em;height:.95em;margin-left:.06em;vertical-align:-.1em;background:var(--text);animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.after{opacity:0;transform:translateY(14px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.hero.done .after{opacity:1;transform:none}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);max-width:52ch;margin:24px auto 32px}
.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:500;font-size:15px;border:1px solid var(--line);background:#0d0d0d;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.28)}
.btn.primary{background:var(--text);color:#000;border-color:var(--text)}

.hero{position:relative}
body{overflow-x:clip}
#ascii{position:absolute;top:0;left:50%;width:100vw;margin-left:-50vw;height:100%;pointer-events:none;opacity:0;transition:opacity 2.4s ease;-webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 62%,transparent 100%)}
#ascii.on{opacity:1}
.hero>.type,.hero>.lead,.hero>.btns{position:relative;z-index:1}
.hero .type,.hero .lead{text-shadow:0 0 14px #000,0 0 30px #000}

/* sections */
section{padding:72px 0 24px}
.sec-head{margin-bottom:28px}
h2{font-size:clamp(26px,4vw,34px);letter-spacing:-.03em;margin:0 0 6px}
.sec-head p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* glow-border card */
.card{--x:50%;--y:50%;position:relative;border-radius:16px;padding:1px;background:var(--line);transition:transform .3s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card:hover{background:rgba(255,255,255,.2)}
.cborder{position:absolute;left:-6px;top:-6px;pointer-events:none;opacity:0;transition:opacity .3s}
.card:hover .cborder,.card:focus-within .cborder{opacity:1}
.card-in{position:relative;height:100%;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:15px;background:var(--card)}
.card-top{display:flex;align-items:center;justify-content:space-between}
.ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#121212;border:1px solid var(--line);flex-shrink:0}
.status{font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);border-radius:999px}
.card h3{margin:4px 0 0;font-size:18px;letter-spacing:-.02em}
.card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.06);color:#b8b8c0}
.link{font-size:14px;color:var(--accent);font-weight:500;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.link::after{content:"";position:absolute;inset:0;border-radius:inherit}
.card:hover .link{text-decoration:underline}

.empty{padding:40px 24px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.empty h3{font-family:var(--mono);font-size:clamp(22px,4vw,30px);margin:0 0 6px;letter-spacing:-.02em}
.empty p{margin:0;color:var(--muted)}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
.card.reveal.in:hover{transform:translateY(-3px);transition-delay:0s}

/* contact */
.contact{margin:48px 0 72px;padding:40px;border:1px solid var(--line);border-radius:20px;background:var(--card);display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.contact h2{margin:0 0 4px}
.contact p{margin:0;color:var(--muted)}
.contact .btns{justify-content:flex-start}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:14px}

/* project modal */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .25s ease}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{width:min(680px,100%);max-height:min(88svh,820px);overflow-y:auto;background:var(--card);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:20px;transform:translateY(14px) scale(.98);transition:transform .28s cubic-bezier(.2,.7,.2,1);box-shadow:0 24px 80px rgba(0,0,0,.85)}
.modal.open .modal-box{transform:none}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.m-id{display:flex;align-items:center;gap:14px;min-width:0}
.m-id h3{margin:0 0 4px;font-family:var(--mono);font-size:clamp(20px,3vw,24px);letter-spacing:-.02em;line-height:1.2}
.m-close{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#121212;color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:20px;line-height:1;flex-shrink:0;transition:color .2s,border-color .2s,background .2s}
.m-close:hover{color:var(--text);border-color:rgba(255,255,255,.28);background:#181818}
.m-summary{margin:0;color:var(--text);font-size:15.5px;line-height:1.65}
.m-feats{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.m-feats li{position:relative;padding-left:18px;color:var(--muted);font-size:14.5px}
.m-feats li::before{content:"›";position:absolute;left:0;color:var(--accent);font-family:var(--mono);font-weight:700}

/* modal gallery / carousel */
.m-gal{display:flex;flex-direction:column;gap:10px}
.m-stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#040404;aspect-ratio:16/9;display:grid;place-items:center}
.m-stage img{width:100%;height:100%;object-fit:cover;display:block}
.m-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.68);backdrop-filter:blur(8px);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:20px;transition:background .2s,border-color .2s}
.m-nav:hover{background:rgba(0,0,0,.9);border-color:rgba(255,255,255,.35)}
.m-nav.prev{left:10px}
.m-nav.next{right:10px}
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.m-dots{display:flex;gap:6px;align-items:center}
.m-dot{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:rgba(255,255,255,.22);cursor:pointer;transition:background .2s,width .2s}
.m-dot.on{width:18px;background:var(--text)}

.m-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.m-foot .btns{justify-content:flex-start}
.m-more{margin-left:auto;border-color:rgba(76,194,255,.35);color:var(--accent)}
.m-more:hover{border-color:var(--accent);background:rgba(76,194,255,.08)}

@media (max-width:640px){
  nav ul a{padding:6px 8px}
  .contact{padding:28px}
  .modal{padding:14px}
  .modal-box{padding:20px}
  .m-more{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal,.after,.modal,.modal-box{opacity:1;transform:none;transition:none}
  .caret{animation:none}
  header{opacity:1;transition:none}
}
</style>
</head>
<body>
<canvas id="intro" aria-hidden="true"></canvas>
<header>
  <div class="wrap"><nav>
    <a class="logo" href="#top" id="logo"></a>
    <ul id="nav-links"></ul>
  </nav></div>
</header>

<main id="top">
  <div class="wrap">
    <div class="hero" id="hero">
      <canvas id="ascii" aria-hidden="true"></canvas>
      <h1 class="type" aria-label="{KylVorn}"><span id="typed" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span></h1>
      <p class="lead after" id="lead" style="--d:.1s"></p>
      <div class="btns after" id="btns" style="--d:.25s"></div>
    </div>

    <div id="sections"></div>

    <section id="contact">
      <div class="contact reveal">
        <div><h2 id="c-title"></h2><p id="c-text"></p></div>
        <div class="btns" id="c-btns"></div>
      </div>
    </section>
  </div>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" aria-hidden="true">
  <div class="modal-box" id="m-box">
    <div class="m-head">
      <div class="m-id">
        <div class="ico" id="m-ico" aria-hidden="true"></div>
        <div>
          <h3 id="m-title"></h3>
          <span class="status" id="m-status"></span>
        </div>
      </div>
      <button class="m-close" id="m-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="m-gal" id="m-gal" hidden></div>
    <p class="m-summary" id="m-summary"></p>
    <ul class="m-feats" id="m-feats" hidden></ul>
    <div class="tags" id="m-tags"></div>
    <div class="m-foot" id="m-foot"></div>
  </div>
</div>

<script src="config.js"></script>
<script>
// ---- Config: built-in defaults merged with window.SITE_CONFIG (config.js) ----
const DEFAULT = {
  lang:"en", title:"{KylVorn}", description:"", brand:"{KylVorn}",
  tab:{title:"",cursor:"_",blink:true,interval:650},
  favicon:{enabled:true,src:"",bg:"#000000",fg:"#f2f2f2"},
  theme:{background:"#000000",card:"#080808",text:"#f2f2f2",muted:"#8a8a93",accent:"#4cc2ff",accent2:"#8b7bff",line:"rgba(255,255,255,.1)",
    fontSans:"Inter, 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif",fontMono:"'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace"},
  intro:{enabled:true,letter:"K",color:"#ffffff",glowColor:"rgba(255,255,255,0.28)",hold:380,pixelate:520,fade:360},
  typing:{startDelay:500,speed:110,jitter:90,caret:true},
  hero:{text:"",buttons:[]},
  sections:[{id:"pet",title:"Pet-projects",subtitle:""},{id:"apps",title:"Apps",subtitle:""}],
  empty:{title:"{Oops!..}",text:"nothing to see here..."},
  card:{linkText:"Learn more",moreLabel:"More..."},
  contact:{enabled:true,navLabel:"Contact",title:"// Contact",text:"",buttonLabel:"hello@example.com",href:"mailto:hello@example.com"},
  footer:"© {year} KylVorn. All rights reserved.",
  ascii:{enabled:true,points:12000,pointsMobile:6000,size:.3,hold:4.5,morph:2.4,shapes:["torus","sphere","cube","trefoil","spring"],chars:" .,-~:;=!*#$@",color:"255,255,255"},
  cardBorder:{enabled:true,chars:"01<>{}/\\|+=*#$@%&",fontSize:8,step:5.5,color:"255,255,255"},
  items:[]
};
const merge = (a,b) => {
  if(b === undefined) return a;
  if(Array.isArray(b) || b === null || typeof b !== "object") return b;
  const o = {...a}; for(const k in b) o[k] = (k in a) ? merge(a[k], b[k]) : b[k]; return o;
};
const CFG = merge(DEFAULT, window.SITE_CONFIG);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slugify = (s, i) => String(s || ("item-" + i)).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || ("item-" + i);
const normImages = item => {
  const raw = Array.isArray(item.images) ? item.images : (item.image ? [item.image] : []);
  return raw.map(x => typeof x === "string" ? { src: x, caption: "" } : x).filter(x => x && x.src);
};

const btnHTML = (b, extraClass = "") => {
  const ext = /^https?:\/\//i.test(b.href || "") ? ' target="_blank" rel="noopener noreferrer"' : "";
  const cls = ["btn", b.primary ? "primary" : "", extraClass].filter(Boolean).join(" ");
  return `<a class="${cls}" href="${esc(b.href || "#")}"${ext}>${esc(b.label)}</a>`;
};

const ITEMS = (CFG.items || []).map((item, idx) => ({ ...item, _id: item.id || slugify(item.title, idx) }));
const ITEM_BY_ID = new Map(ITEMS.map(item => [item._id, item]));

const cardHTML = p => {
  const useModal = p.modal !== false;
  const action = useModal
    ? `<button class="link" type="button" data-open="${esc(p._id)}">${esc(CFG.card.linkText)}</button>`
    : `<a class="link" href="${esc(p.url || "#")}">${esc(CFG.card.linkText)}</a>`;
  return `<article class="card reveal" data-item="${esc(p._id)}"><div class="card-in">
    <div class="card-top"><div class="ico" aria-hidden="true">${p.icon || "📦"}</div><span class="status">${esc(p.status || "")}</span></div>
    <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
    <div class="tags">${(p.tags||[]).map(t => `<span>${esc(t)}</span>`).join("")}</div>
    ${action}</div></article>`;
};

const $ = id => document.getElementById(id);
const rs = document.documentElement.style, T = CFG.theme;
Object.entries({bg:T.background,card:T.card,text:T.text,muted:T.muted,accent:T.accent,"accent-2":T.accent2,line:T.line,sans:T.fontSans,mono:T.fontMono}).forEach(([k,v]) => rs.setProperty("--"+k, v));
document.documentElement.lang = CFG.lang;

// ---- Favicon ({K} SVG by default, or custom image via config.favicon.src) ----
(function applyFavicon(){
  const favLink = document.getElementById("favicon");
  if(!favLink) return;
  const fav = CFG.favicon || {};
  if(fav.enabled === false){ favLink.remove(); return; }
  if(fav.src){ favLink.href = fav.src; return; }
  const bg = fav.bg || T.background || "#000000";
  const fg = fav.fg || T.text || "#f2f2f2";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">`
    + `<rect width="64" height="64" rx="14" fill="${bg}"/>`
    + `<text x="32" y="42" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="30" fill="${fg}">{K}</text>`
    + `</svg>`;
  favLink.href = "data:image/svg+xml," + encodeURIComponent(svg);
})();

// ---- Browser tab title + blinking cursor ----
(function applyTabTitle(){
  const tabCfg = CFG.tab || {};
  const baseTitle = tabCfg.title || CFG.title || CFG.brand || "{KylVorn}";
  const cursor = tabCfg.cursor ?? "_";
  const shouldBlink = tabCfg.blink !== false && Boolean(cursor) && !reduce;

  document.title = baseTitle;
  [["meta[name=description]",CFG.description],['meta[property="og:title"]',baseTitle],['meta[property="og:description"]',CFG.description]]
    .forEach(([s,v]) => { const m = document.querySelector(s); if(m) m.content = v; });

  if(!shouldBlink) return;
  let showCursor = true;
  setInterval(() => {
    showCursor = !showCursor;
    document.title = showCursor ? `${baseTitle}${cursor}` : `${baseTitle}\u00A0`;
  }, Math.max(250, Number(tabCfg.interval) || 650));
})();

$("logo").textContent = CFG.brand; document.querySelector(".type").setAttribute("aria-label", CFG.brand);
if(!CFG.typing.caret) document.querySelector(".caret").remove();
$("lead").textContent = CFG.hero.text;
$("btns").innerHTML = CFG.hero.buttons.map(b => btnHTML(b)).join("");

const secs = CFG.sections;
$("nav-links").innerHTML = [...secs.map(s => [s.id, s.navLabel || s.title]), ...(CFG.contact.enabled ? [["contact", CFG.contact.navLabel]] : [])]
  .map(([id,l]) => `<li><a href="#${esc(id)}">${esc(l)}</a></li>`).join("");
$("sections").innerHTML = secs.map(s => `<section id="${esc(s.id)}"><div class="sec-head reveal"><h2>${esc(s.title)}</h2><p>${esc(s.subtitle||"")}</p></div><div class="grid" id="grid-${esc(s.id)}"></div></section>`).join("");
secs.forEach(s => {
  const grid = $("grid-" + s.id), list = ITEMS.filter(i => i.category === s.id);
  if(!list.length){
    const e = {...CFG.empty, ...(s.empty || {})};
    grid.outerHTML = `<div class="empty reveal"><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p></div>`; return;
  }
  grid.innerHTML = list.map(cardHTML).join("");
  grid.querySelectorAll(".card").forEach((c,i) => c.style.setProperty("--d", (i * .08) + "s"));
});
if(CFG.contact.enabled){
  const C = CFG.contact;
  $("c-title").textContent = C.title;
  $("c-text").textContent = C.text;
  const list = Array.isArray(C.buttons) ? C.buttons : (C.buttonLabel ? [{ label: C.buttonLabel, href: C.href, primary: true }] : []);
  $("c-btns").innerHTML = list.map(b => btnHTML(b)).join("");
} else $("contact").remove();
$("footer").textContent = CFG.footer.replace("{year}", new Date().getFullYear());

// ---- Project Modal with Screenshot Carousel & Dynamic Buttons ----
const modal = $("modal"), mGal = $("m-gal"), mFeats = $("m-feats"), mFoot = $("m-foot");
let activeItem = null, activeSlide = 0, activeImages = [], lastFocus = null;

function renderModalGallery(){
  if(!activeImages.length){ mGal.hidden = true; mGal.innerHTML = ""; return; }
  mGal.hidden = false;
  const img = activeImages[activeSlide];
  const multi = activeImages.length > 1;
  mGal.innerHTML = `
    <div class="m-stage">
      <img src="${esc(img.src)}" alt="${esc(img.caption || activeItem.title)}">
      ${multi ? `<button class="m-nav prev" type="button" data-step="-1" aria-label="Previous screenshot">‹</button>
                 <button class="m-nav next" type="button" data-step="1" aria-label="Next screenshot">›</button>` : ""}
    </div>
    ${(img.caption || multi) ? `<div class="m-bar">
      <span>${esc(img.caption || `${activeSlide + 1} / ${activeImages.length}`)}</span>
      ${multi ? `<div class="m-dots">${activeImages.map((_, i) => `<button class="m-dot${i === activeSlide ? " on" : ""}" type="button" data-slide="${i}" aria-label="Slide ${i + 1}"></button>`).join("")}</div>` : ""}
    </div>` : ""}`;
}

function openModal(id, updateHash = true){
  const item = ITEM_BY_ID.get(id);
  if(!item) return;
  activeItem = item;
  activeImages = normImages(item);
  activeSlide = 0;
  lastFocus = document.activeElement;

  $("m-ico").textContent = item.icon || "📦";
  $("m-title").textContent = item.title || "";
  const st = $("m-status");
  if(item.status){ st.hidden = false; st.textContent = item.status; } else st.hidden = true;
  $("m-summary").textContent = item.summary || item.desc || "";

  if(Array.isArray(item.features) && item.features.length){
    mFeats.hidden = false;
    mFeats.innerHTML = item.features.map(f => `<li>${esc(f)}</li>`).join("");
  } else {
    mFeats.hidden = true;
    mFeats.innerHTML = "";
  }

  $("m-tags").innerHTML = (item.tags || []).map(t => `<span>${esc(t)}</span>`).join("");
  renderModalGallery();

  const links = Array.isArray(item.links)
    ? item.links
    : (item.url && item.url !== "#" ? [{ label: CFG.card.linkText, href: item.url, primary: true }] : []);

  const moreBtn = item.hasPage
    ? btnHTML({ label: item.moreLabel || CFG.card.moreLabel || "More...", href: item.pageUrl || (`project.html?id=${encodeURIComponent(item._id)}`), primary: false }, "m-more")
    : "";

  if(links.length || moreBtn){
    mFoot.hidden = false;
    mFoot.innerHTML = `<div class="btns">${links.map(b => btnHTML(b)).join("")}</div>${moreBtn}`;
  } else {
    mFoot.hidden = true;
    mFoot.innerHTML = "";
  }

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-open");
  $("m-box").scrollTop = 0;
  $("m-close").focus({ preventScroll: true });

  if(updateHash && location.hash !== "#" + item._id){
    history.replaceState(null, "", "#" + item._id);
  }
}

function closeModal(clearHash = true){
  if(!modal.classList.contains("open")) return;
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-open");
  if(clearHash && activeItem && location.hash === "#" + activeItem._id){
    history.replaceState(null, "", location.pathname + location.search);
  }
  activeItem = null;
  if(lastFocus && typeof lastFocus.focus === "function") lastFocus.focus({ preventScroll: true });
}

document.addEventListener("click", e => {
  const trigger = e.target.closest("[data-open]");
  if(trigger){ e.preventDefault(); openModal(trigger.dataset.open); return; }
  const stepBtn = e.target.closest("[data-step]");
  if(stepBtn && activeImages.length > 1){
    activeSlide = (activeSlide + Number(stepBtn.dataset.step) + activeImages.length) % activeImages.length;
    renderModalGallery();
    return;
  }
  const dotBtn = e.target.closest("[data-slide]");
  if(dotBtn){
    activeSlide = Number(dotBtn.dataset.slide);
    renderModalGallery();
  }
});
$("m-close").addEventListener("click", () => closeModal());
modal.addEventListener("click", e => { if(e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if(!modal.classList.contains("open")) return;
  if(e.key === "Escape") closeModal();
  else if(e.key === "ArrowRight" && activeImages.length > 1){ activeSlide = (activeSlide + 1) % activeImages.length; renderModalGallery(); }
  else if(e.key === "ArrowLeft" && activeImages.length > 1){ activeSlide = (activeSlide - 1 + activeImages.length) % activeImages.length; renderModalGallery(); }
});

function checkHashModal(){
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  if(id && ITEM_BY_ID.has(id)) openModal(id, false);
}
window.addEventListener("hashchange", checkHashModal);
checkHashModal();

// Glow border follows the cursor
document.addEventListener("pointermove", e => {
  const c = e.target.closest && e.target.closest(".card");
  if(!c) return;
  const r = c.getBoundingClientRect();
  c._mx = e.clientX - r.left; c._my = e.clientY - r.top;
});

// Typing animation for {KylVorn}
const word = CFG.brand, out = document.getElementById("typed"), hero = document.getElementById("hero");
const paint = n => out.innerHTML = word.slice(0,n).split("").map(ch => (ch === "{" || ch === "}") ? `<span class="br">${ch}</span>` : ch).join("");

// ---- ASCII 3D: morphing point-cloud shapes rendered as characters ----
const cv = document.getElementById("ascii"), g = cv.getContext("2d");
const N = innerWidth < 700 ? CFG.ascii.pointsMobile : CFG.ascii.points, TAU = Math.PI * 2, RAMP = CFG.ascii.chars, CW = 7.2, CH = 12;
const rnd = Float32Array.from({length:N}, Math.random);
const norm = v => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; };
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
function build(fn){
  const P = new Float32Array(N*3), Q = new Float32Array(N*3);
  for(let i=0;i<N;i++){ const [p,n] = fn(i/N, Math.random(), Math.random()); P.set(p,i*3); Q.set(n,i*3); }
  return {P,Q};
}
const tube = (K,r) => build(a => {
  const t=a*TAU, p=K(t), q=K(t+.01), T=norm([q[0]-p[0],q[1]-p[1],q[2]-p[2]]);
  const n1=norm(cross(T,[.31,.52,.79])), n2=cross(T,n1), f=Math.random()*TAU, c=Math.cos(f), s=Math.sin(f);
  const n=[c*n1[0]+s*n2[0], c*n1[1]+s*n2[1], c*n1[2]+s*n2[2]];
  return [[p[0]+r*n[0], p[1]+r*n[1], p[2]+r*n[2]], n];
});
const ALL = [
  build((a,b) => { const t=a*TAU, f=b*TAU, c=Math.cos(f), R=1, r=.42;                 // torus
    return [[(R+r*c)*Math.cos(t),(R+r*c)*Math.sin(t),r*Math.sin(f)],[c*Math.cos(t),c*Math.sin(t),Math.sin(f)]]; }),
  build((a,b) => { const z=1-2*a, r=Math.sqrt(1-z*z), t=b*TAU*7, n=[r*Math.cos(t),r*Math.sin(t),z]; // sphere
    return [n.map(v=>v*1.25), n]; }),
  build((a,b,c) => { const f=Math.floor(a*6), ax=f%3, sg=f<3?1:-1, p=[0,0,0], n=[0,0,0];   // cube
    p[ax]=sg; p[(ax+1)%3]=b*2-1; p[(ax+2)%3]=c*2-1; n[ax]=sg; return [p.map(v=>v*.95), n]; }),
  tube(t => [(Math.sin(t)+2*Math.sin(2*t))*.33, (Math.cos(t)-2*Math.cos(2*t))*.33, -Math.sin(3*t)*.33], .2), // trefoil knot
  tube(t => [Math.cos(4*t)*.75, Math.sin(4*t)*.75, (t/TAU*2-1)*1.05], .17)             // spring
];
const NAMES = ["torus","sphere","cube","trefoil","spring"];
const shapes = ALL.filter((_,i) => CFG.ascii.shapes.includes(NAMES[i])); if(!shapes.length) shapes.push(ALL[0]);
let W,H,cols,rows,zb,lb, sx,cxn,sy,cy,sz,cz;
const COL = RAMP.split("").map((_,k) => `rgba(${CFG.ascii.color},${(.1+.5*k/(RAMP.length-1)).toFixed(2)})`);
const ease = x => x*x*(3-2*x), L = norm([.35,-.5,-.8]), v3 = [0,0,0], n3 = [0,0,0];
function rot(r){
  let y=r[1]*cxn-r[2]*sx, z=r[1]*sx+r[2]*cxn, x=r[0];
  let x2=x*cy+z*sy; z=-x*sy+z*cy; x=x2;
  let x3=x*cz-y*sz; y=x*sz+y*cz; r[0]=x3; r[1]=y; r[2]=z;
}
function size(){
  const dpr=Math.min(devicePixelRatio||1,2), b=cv.getBoundingClientRect(); W=b.width; H=b.height;
  cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0);
  g.font="12px 'JetBrains Mono',ui-monospace,Consolas,monospace"; g.textBaseline="top";
  cols=Math.ceil(W/CW); rows=Math.ceil(H/CH); zb=new Float32Array(cols*rows); lb=new Float32Array(cols*rows);
}
function frame(t){
  zb.fill(1e9); lb.fill(-1); g.clearRect(0,0,W,H);
  const HOLD=CFG.ascii.hold, MORPH=CFG.ascii.morph, cyc=HOLD+MORPH, k=Math.floor(t/cyc), ph=t%cyc;
  const A=shapes[k%shapes.length], B=shapes[(k+1)%shapes.length];
  const m = ph<HOLD ? 0 : ease((ph-HOLD)/MORPH), burst = Math.sin(Math.PI*m);
  const ax=t*.35, ay=t*.5, az=t*.17;
  sx=Math.sin(ax); cxn=Math.cos(ax); sy=Math.sin(ay); cy=Math.cos(ay); sz=Math.sin(az); cz=Math.cos(az);
  const S=Math.min(W,H)*(CFG.ascii.size+.03*Math.sin(t*1.1))*(1-.2*burst), ox=W/2+Math.sin(t*.4)*Math.min(W,H)*.08, oy=H/2+Math.cos(t*.33)*H*.025;
  for(let i=0;i<N;i++){
    const j=i*3, e=1+burst*rnd[i]*.55;
    for(let c=0;c<3;c++){
      v3[c]=(A.P[j+c]+(B.P[j+c]-A.P[j+c])*m)*e;
      n3[c]=A.Q[j+c]+(B.Q[j+c]-A.Q[j+c])*m;
    }
    rot(v3); rot(n3);
    const d=v3[2]+6, f=6/d, ci=((ox+v3[0]*S*f)/CW)|0, ri=((oy+v3[1]*S*f)/CH)|0;
    if(ci<0||ci>=cols||ri<0||ri>=rows) continue;
    const idx=ri*cols+ci;
    if(d<zb[idx]){
      zb[idx]=d;
      const nl=Math.sqrt(n3[0]*n3[0]+n3[1]*n3[1]+n3[2]*n3[2])||1, lum=(n3[0]*L[0]+n3[1]*L[1]+n3[2]*L[2])/nl;
      lb[idx]=Math.min(1,Math.max(.05,.1+.9*Math.max(lum,0)));
    }
  }
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const v=lb[r*cols+c]; if(v<0) continue;
    const q=1+Math.round(v*(RAMP.length-2)); g.fillStyle=COL[q]; g.fillText(RAMP[q],c*CW,r*CH);
  }
}
let t0=0, vis=true;
function loop(ts){ if(!t0) t0=ts; if(vis) frame((ts-t0)/1000); requestAnimationFrame(loop); }
function startAscii(){
  if(!CFG.ascii.enabled) return;
  size(); addEventListener("resize", size);
  if("IntersectionObserver" in window) new IntersectionObserver(es => vis=es[0].isIntersecting).observe(hero);
  cv.classList.add("on");
  if(reduce) frame(1); else requestAnimationFrame(loop);
}
const finish = () => { hero.classList.add("done"); document.body.classList.add("ready"); startAscii(); };
function startHero(){
  if(reduce){ paint(word.length); finish(); return; }
  let n = 0;
  setTimeout(function tick(){
    paint(++n);
    if(n < word.length) setTimeout(tick, CFG.typing.speed + Math.random() * CFG.typing.jitter);
    else setTimeout(finish, 350);
  }, CFG.typing.startDelay);
}

// ---- Intro animation: smooth realistic glyph -> pixel mosaic -> ASCII grid -> reveal ----
(function runIntro(){
  const ic = document.getElementById("intro");
  if(!CFG.intro.enabled || reduce){ ic.remove(); startHero(); return; }
  const ctx = ic.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let iw = innerWidth, ih = innerHeight;
  ic.width = iw * dpr; ic.height = ih * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const off = document.createElement("canvas"), og = off.getContext("2d");
  off.width = iw * dpr; off.height = ih * dpr;
  og.setTransform(dpr, 0, 0, dpr, 0, 0);

  const fontSize = Math.min(iw, ih) * 0.42;
  og.font = `700 ${fontSize}px ${T.fontMono}`;
  og.textAlign = "center";
  og.textBaseline = "middle";

  const isGrad = CFG.intro.color === "gradient";
  const mainColor = isGrad ? T.accent : (CFG.intro.color || "#ffffff");
  const glow = CFG.intro.glowColor || "rgba(255,255,255,0.28)";

  const rad = og.createRadialGradient(iw/2, ih/2, fontSize*0.05, iw/2, ih/2, fontSize*0.85);
  rad.addColorStop(0, glow);
  rad.addColorStop(1, "rgba(0, 0, 0, 0)");
  og.fillStyle = rad;
  og.fillRect(0, 0, iw, ih);

  let fillStyle = mainColor;
  if(isGrad){
    const grad = og.createLinearGradient(iw/2 - fontSize*0.3, ih/2 - fontSize*0.4, iw/2 + fontSize*0.35, ih/2 + fontSize*0.45);
    grad.addColorStop(0, "#ffffff");
    grad.addColorStop(0.45, "#d8eeff");
    grad.addColorStop(0.75, T.accent);
    grad.addColorStop(1, T.accent2);
    fillStyle = grad;
  }

  og.save();
  og.shadowColor = glow;
  og.shadowBlur = fontSize * 0.14;
  og.fillStyle = fillStyle;
  og.fillText(CFG.intro.letter, iw/2, ih/2 + fontSize*0.04);
  og.restore();

  og.lineWidth = Math.max(1.5, fontSize * 0.008);
  og.strokeStyle = "rgba(255,255,255,0.55)";
  og.strokeText(CFG.intro.letter, iw/2, ih/2 + fontSize*0.04);

  const pix = document.createElement("canvas"), pg = pix.getContext("2d", { willReadFrequently: true });
  const glyphs = CFG.cardBorder.chars;
  const { hold, pixelate, fade } = CFG.intro;
  const total = hold + pixelate + fade;
  let start = 0, heroStarted = false;

  function renderIntro(ts){
    if(!start) start = ts;
    const elapsed = ts - start;
    ctx.fillStyle = T.background;
    ctx.fillRect(0, 0, iw, ih);

    if(elapsed < hold){
      const p = elapsed / hold;
      const sc = 0.96 + 0.04 * (1 - Math.pow(1 - p, 3));
      ctx.save();
      ctx.translate(iw/2, ih/2);
      ctx.scale(sc, sc);
      ctx.drawImage(off, -iw/2, -ih/2, iw, ih);
      ctx.restore();
    } else if(elapsed < hold + pixelate){
      const p = (elapsed - hold) / pixelate;
      const e = p * p * (3 - 2 * p);
      const block = Math.max(2, Math.round(2 + e * 26));
      const cols = Math.max(1, Math.ceil(iw / block));
      const rows = Math.max(1, Math.ceil(ih / block));

      pix.width = cols; pix.height = rows;
      pg.imageSmoothingEnabled = true;
      pg.clearRect(0, 0, cols, rows);
      pg.drawImage(off, 0, 0, cols, rows);

      if(p < 0.75){
        ctx.save();
        ctx.globalAlpha = 1 - Math.max(0, (p - 0.35) / 0.4);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(pix, 0, 0, cols * block, rows * block);
        ctx.restore();
      }

      if(p > 0.25){
        const asciiAlpha = Math.min(1, (p - 0.25) / 0.45);
        const img = pg.getImageData(0, 0, cols, rows).data;
        ctx.font = `700 ${Math.max(9, block * 0.85)}px ${T.fontMono}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const tick = Math.floor(elapsed / 55);

        for(let y = 0; y < rows; y++){
          for(let x = 0; x < cols; x++){
            const idx = (y * cols + x) * 4;
            const r = img[idx], gCol = img[idx+1], b = img[idx+2], a = img[idx+3];
            const lum = (0.299*r + 0.587*gCol + 0.114*b) * (a / 255);
            if(lum < 14) continue;
            const ch = glyphs[(x * 13 + y * 7 + tick) % glyphs.length];
            const intensity = Math.min(1, lum / 210);
            ctx.fillStyle = `rgba(${r},${gCol},${b},${(intensity * asciiAlpha).toFixed(2)})`;
            ctx.fillText(ch, x * block + block/2, y * block + block/2);
          }
        }
      }
    } else {
      if(!heroStarted){ heroStarted = true; startHero(); }
      const p = Math.min(1, (elapsed - hold - pixelate) / fade);
      const block = 28 + Math.round(p * 18);
      const cols = Math.max(1, Math.ceil(iw / block));
      const rows = Math.max(1, Math.ceil(ih / block));

      pix.width = cols; pix.height = rows;
      pg.clearRect(0, 0, cols, rows);
      pg.drawImage(off, 0, 0, cols, rows);
      const img = pg.getImageData(0, 0, cols, rows).data;

      ctx.font = `700 ${Math.max(10, block * 0.7)}px ${T.fontMono}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const tick = Math.floor(elapsed / 55);

      for(let y = 0; y < rows; y++){
        for(let x = 0; x < cols; x++){
          const idx = (y * cols + x) * 4;
          const lum = (0.299*img[idx] + 0.587*img[idx+1] + 0.114*img[idx+2]) * (img[idx+3] / 255);
          if(lum < 18) continue;
          const ch = glyphs[(x * 13 + y * 7 + tick) % glyphs.length];
          const alpha = (1 - p) * Math.min(1, lum / 210);
          ctx.fillStyle = `rgba(${img[idx]},${img[idx+1]},${img[idx+2]},${alpha.toFixed(2)})`;
          ctx.fillText(ch, x * block + block/2, y * block + block/2);
        }
      }
      ic.style.opacity = String(1 - p);
    }

    if(elapsed < total){
      requestAnimationFrame(renderIntro);
    } else {
      ic.remove();
      if(!heroStarted) startHero();
    }
  }
  requestAnimationFrame(renderIntro);
})();

// ASCII border on card hover: symbols light up around the cursor
const GL = CFG.cardBorder.chars, PAD = 6;
function ring(w,h,r,step){
  const Lt=w-2*r, Lr=h-2*r, La=Math.PI*r/2, T=2*Lt+2*Lr+4*La, n=Math.round(T/step), P=[];
  for(let i=0;i<n;i++){
    let s=i*T/n, x, y;
    const arc=(cx,cy,a0)=>{ const a=a0+s/r; x=cx+r*Math.cos(a); y=cy+r*Math.sin(a); };
    if(s<Lt){ x=r+s; y=0; }
    else if((s-=Lt)<La) arc(w-r,r,-Math.PI/2);
    else if((s-=La)<Lr){ x=w; y=r+s; }
    else if((s-=Lr)<La) arc(w-r,h-r,0);
    else if((s-=La)<Lt){ x=w-r-s; y=h; }
    else if((s-=Lt)<La) arc(r,h-r,Math.PI/2);
    else if((s-=La)<Lr){ x=0; y=h-r-s; }
    else { s-=Lr; arc(r,r,Math.PI); }
    P.push([x,y]);
  }
  return P;
}
const cardStates = (CFG.cardBorder.enabled ? [...document.querySelectorAll(".card")] : []).map(c => {
  const cvs = document.createElement("canvas"); cvs.className = "cborder"; cvs.setAttribute("aria-hidden","true"); c.appendChild(cvs);
  const s = { c, cvs, g: cvs.getContext("2d"), w:0, h:0, on:false, off:-9 };
  const fit = () => {
    s.w = c.offsetWidth; s.h = c.offsetHeight; const dpr = Math.min(devicePixelRatio||1,2);
    cvs.width = (s.w+PAD*2)*dpr; cvs.height = (s.h+PAD*2)*dpr; cvs.style.width = (s.w+PAD*2)+"px"; cvs.style.height = (s.h+PAD*2)+"px";
    s.g.setTransform(dpr,0,0,dpr,0,0); s.g.font = CFG.cardBorder.fontSize + "px 'JetBrains Mono',ui-monospace,Consolas,monospace"; s.g.textAlign = "center"; s.g.textBaseline = "middle"; s.P = ring(s.w, s.h, 16, CFG.cardBorder.step);
  };
  fit(); if("ResizeObserver" in window) new ResizeObserver(fit).observe(c);
  const leave = () => { s.on = false; s.off = performance.now()/1000; };
  c.addEventListener("pointerenter", () => { s.on = true; if(c._mx === undefined){ c._mx = s.w/2; c._my = s.h/2; } });
  c.addEventListener("pointerleave", leave);
  c.addEventListener("focusin", () => { c._mx = s.w/2; c._my = s.h/2; s.on = true; });
  c.addEventListener("focusout", leave);
  return s;
});
function drawBorders(now){
  for(const s of cardStates){
    if(!s.on && now - s.off > .45) continue;
    const {g,w,h,c} = s, X = w+PAD*2, Y = h+PAD*2, mx = (c._mx||0)+PAD, my = (c._my||0)+PAD;
    g.clearRect(0,0,X,Y);
    const tick = reduce ? 0 : Math.floor(now*7);
    const P = s.P || [];
    for(let i=0; i<P.length; i++){
      const x = P[i][0]+PAD, y = P[i][1]+PAD;
      const a = .14 + .86*Math.exp(-((x-mx)**2 + (y-my)**2)/(2*90*90));
      g.fillStyle = `rgba(${CFG.cardBorder.color},${a.toFixed(2)})`;
      g.fillText(GL[(i*7 + tick*(1+i%3)) % GL.length], x, y);
    }
  }
}
(function bl(){ drawBorders(performance.now()/1000); requestAnimationFrame(bl); })();

// Scroll reveal
const io = "IntersectionObserver" in window ? new IntersectionObserver((es,o) => es.forEach(en => {
  if(en.isIntersecting){ en.target.classList.add("in"); o.unobserve(en.target); }
}), { threshold:.12, rootMargin:"0px 0px -40px 0px" }) : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));
</script>
